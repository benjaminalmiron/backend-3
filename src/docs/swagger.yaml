# src/docs/swagger.yaml
openapi: 3.0.0
info:
  title: AdoptMe API Documentation
  version: 1.0.0
  description: Documentación interactiva para la API de AdoptMe, incluyendo usuarios, mascotas y pruebas de logging.
  contact:
    name: Benja
    email: tu.email@example.com # ¡RECUERDA CAMBIAR ESTO POR TU EMAIL!

servers:
  - url: http://localhost:4000
    description: Servidor de Desarrollo Local

tags:
  - name: Users
    description: Operaciones de gestión de usuarios
  - name: Pets
    description: Operaciones de gestión de mascotas
  - name: Logging
    description: Pruebas de los niveles de logging
  - name: Adoptions
    description: Operaciones de gestión de adopciones

paths:
  # --- RUTAS DE USUARIOS (/api/users) ---
  /api/users:
    get:
      summary: Obtener todos los usuarios
      tags: [Users]
      description: Recupera una lista de todos los usuarios registrados en el sistema.
      responses:
        '200':
          description: OK. Lista de usuarios obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crear un nuevo usuario
      tags: [Users]
      description: Crea un nuevo usuario en el sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Usuario creado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos o incompletos proporcionados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{uid}:
    get:
      summary: Obtener un usuario por ID
      tags: [Users]
      description: Recupera los detalles de un usuario específico utilizando su ID.
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
          description: ID único del usuario a recuperar.
      responses:
        '200':
          description: OK. Usuario obtenido exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/User'
        '404':
          description: Usuario no encontrado con el ID proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Actualizar un usuario existente
      tags: [Users]
      description: Actualiza los datos de un usuario existente por su ID.
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
          description: ID único del usuario a actualizar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Usuario actualizado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User updated
                  payload:
                    $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos para la actualización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado para actualizar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Eliminar un usuario
      tags: [Users]
      description: Elimina un usuario del sistema por su ID.
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
          description: ID único del usuario a eliminar.
      responses:
        '200':
          description: Usuario eliminado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User deleted
        '404':
          description: Usuario no encontrado para eliminar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- RUTAS DE MASCOTAS (/api/pets) ---
  /api/pets:
    get:
      summary: Obtener todas las mascotas
      tags: [Pets]
      description: Recupera una lista de todas las mascotas registradas en el sistema.
      responses:
        '200':
          description: OK. Lista de mascotas obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pet'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crear una nueva mascota
      tags: [Pets]
      description: Crea una nueva mascota en el sistema. Soporta también subida de imagen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nombre de la mascota
                specie:
                  type: string
                  description: Especie de la mascota
                breed:
                  type: string
                  description: Raza de la mascota
                age:
                  type: integer
                  description: Edad de la mascota
                description:
                  type: string
                  description: Descripción adicional de la mascota
                image:
                  type: string
                  format: binary
                  description: Archivo de imagen de la mascota
              required:
                - name
                - specie
      responses:
        '200':
          description: Mascota creada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Pet'
        '400':
          description: Datos inválidos o incompletos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/pets/{pid}:
    get:
      summary: Obtener una mascota por ID
      tags: [Pets]
      description: Recupera los detalles de una mascota específica utilizando su ID.
      parameters:
        - in: path
          name: pid
          schema:
            type: string
          required: true
          description: ID único de la mascota a recuperar.
      responses:
        '200':
          description: OK. Mascota obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Pet'
        '404':
          description: Mascota no encontrada con el ID proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Actualizar una mascota existente
      tags: [Pets]
      description: Actualiza los datos de una mascota existente por su ID.
      parameters:
        - in: path
          name: pid
          schema:
            type: string
          required: true
          description: ID único de la mascota a actualizar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdateInput'
      responses:
        '200':
          description: Mascota actualizada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: pet updated
                  payload:
                    $ref: '#/components/schemas/Pet'
        '400':
          description: Datos inválidos para la actualización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Mascota no encontrada para actualizar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Eliminar una mascota
      tags: [Pets]
      description: Elimina una mascota del sistema por su ID.
      parameters:
        - in: path
          name: pid
          schema:
            type: string
          required: true
          description: ID único de la mascota a eliminar.
      responses:
        '200':
          description: Mascota eliminada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: pet deleted
        '404':
          description: Mascota no encontrada para eliminar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- RUTAS DE ADOPCIONES (/api/adoptions) ---
  /api/adoptions:
    get:
      summary: Obtener todas las adopciones
      tags: [Adoptions]
      description: Recupera una lista de todas las adopciones registradas en el sistema.
      responses:
        '200':
          description: OK. Lista de adopciones obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adoption'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/adoptions/{aid}:
    get:
      summary: Obtener una adopción por ID
      tags: [Adoptions]
      description: Recupera los detalles de una adopción específica utilizando su ID.
      parameters:
        - in: path
          name: aid
          schema:
            type: string
          required: true
          description: ID único de la adopción a recuperar.
      responses:
        '200':
          description: OK. Adopción obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Adoption'
        '404':
          description: Adopción no encontrada con el ID proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/adoptions/{uid}/{pid}:
    post:
      summary: Crear una nueva adopción
      tags: [Adoptions]
      description: Crea una nueva adopción para un usuario y una mascota específicos.
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
          description: ID único del usuario que adopta.
        - in: path
          name: pid
          schema:
            type: string
          required: true
          description: ID único de la mascota a adoptar.
      responses:
        '201':
          description: Mascota adoptada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Pet adopted successfully
                  payload:
                    $ref: '#/components/schemas/Adoption'
        '400':
          description: Solicitud inválida (ej. mascota ya adoptada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario o mascota no encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- RUTAS DE LOGGING (/loggerTest) ---
  /loggerTest:
    get:
      summary: Probar los niveles de logging
      tags: [Logging]
      description: Dispara mensajes en todos los niveles del logger (debug, http, info, warning, error, fatal) para probar la configuración.
      responses:
        '200':
          description: Mensajes de log enviados. Revisa tu consola y el archivo errors.log.
          content:
            text/plain:
              example: Logs de prueba enviados. Revisa tu consola y el archivo errors.log
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # --- Esquema de Respuesta de Error Global ---
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          example: Mensaje de error detallado.

    # --- Esquemas para USUARIOS ---
    User:
      type: object
      properties:
        _id:
          type: string
          description: ID único del usuario generado por la base de datos.
          example: "60c72b2f9b1d8e001c8c4a00"
        first_name:
          type: string
          example: "Juan"
        last_name:
          type: string
          example: "Pérez"
        email:
          type: string
          format: email
          example: "juan.perez@example.com"
        age:
          type: integer
          example: 30
        password:
          type: string
          description: Contraseña del usuario (hashing)
          example: "$2a$10$abcdef1234567890abcdef1234567890" # Ejemplo de hash, no la contraseña plana
        pets:
          type: array
          items:
            type: string # Si solo guardas IDs de mascotas
          description: IDs de las mascotas adoptadas por el usuario.
          example: ["60c72b2f9b1d8e001c8c4a01", "60c72b2f9b1d8e001c8c4a02"]
      required:
        - first_name
        - last_name
        - email
        - password

    UserInput:
      type: object
      properties:
        first_name:
          type: string
          example: "Nuevo"
        last_name:
          type: string
          example: "Usuario"
        email:
          type: string
          format: email
          example: "nuevo.usuario@example.com"
        password:
          type: string
          example: "password123"
        age:
          type: integer
          example: 25
      required:
        - first_name
        - last_name
        - email
        - password

    # --- Esquemas para MASCOTAS ---
    Pet:
      type: object
      properties:
        _id:
          type: string
          description: ID único de la mascota generado por la base de datos.
          example: "60c72b2f9b1d8e001c8c4a01"
        name:
          type: string
          example: "Firulais"
        specie:
          type: string
          example: "Dog"
        breed:
          type: string
          example: "Golden Retriever"
        birthDate:
          type: string
          format: date
          example: "2022-05-15"
        adopted:
          type: boolean
          example: false
          description: Indica si la mascota ha sido adoptada.
        owner:
          type: string
          description: ID del usuario que adoptó la mascota, si aplica.
          nullable: true
          example: "60c72b2f9b1d8e001c8c4a00"
        image:
          type: string
          description: URL de la imagen de la mascota.
          nullable: true
          example: "http://localhost:4000/public/images/firulais.jpg"
      required:
        - name
        - specie
        - birthDate

    PetInput:
      type: object
      properties:
        name:
          type: string
          example: "Max"
        specie:
          type: string
          example: "Cat"
        breed:
          type: string
          example: "Siamese"
        birthDate:
          type: string
          format: date
          example: "2023-03-20"
        age:
          type: integer
          example: 1
        description:
          type: string
          example: "Gato juguetón y cariñoso."
      required:
        - name
        - specie
        - birthDate

    PetUpdateInput:
      type: object
      properties:
        name:
          type: string
          example: "Maximus"
        specie:
          type: string
          example: "Cat"
        breed:
          type: string
          example: "Bengalí"
        birthDate:
          type: string
          format: date
          example: "2023-03-20"
        age:
          type: integer
          example: 2
        description:
          type: string
          example: "Gato juguetón, cariñoso y muy activo."
        adopted:
          type: boolean
          example: true
        owner:
          type: string
          description: ID del nuevo dueño si la mascota es adoptada.
          nullable: true
          example: "60c72b2f9b1d8e001c8c4a00"
        image:
          type: string
          description: URL de la nueva imagen de la mascota.
          nullable: true
          example: "http://localhost:4000/public/images/maximus.jpg"

    # --- Esquemas para ADOPCIONES ---
    Adoption:
      type: object
      properties:
        _id:
          type: string
          description: ID único de la adopción generado por la base de datos.
          example: "60c72b2f9b1d8e001c8c4a03"
        owner:
          $ref: '#/components/schemas/User'
          description: Detalles del usuario que adoptó.
        pet:
          $ref: '#/components/schemas/Pet'
          description: Detalles de la mascota adoptada.
        adoptionDate:
          type: string
          format: date-time
          description: Fecha y hora de la adopción.
          example: "2025-06-21T15:00:00Z"
      required:
        - owner
        - pet
        - adoptionDate
# La sección 'components' debería ir aquí, al mismo nivel que 'paths', 'tags', etc.
# Si esta sección no está, o está mal indentada, causará los errores de "Could not resolve reference".